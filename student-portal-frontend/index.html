<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal — LBU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-box">
        <h2>🎓 Student Portal</h2>
        <p style="text-align:center; color:#888; margin-bottom:20px; font-size:0.9rem;">Leeds Beckett University</p>

        <div id="alert" class="alert hidden"></div>

        <!-- LOGIN FORM -->
        <div id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password">
            </div>
            <button class="btn" onclick="login()">Login</button>
            <div class="toggle-link">
                Don't have an account? <span onclick="showRegister()">Register here</span>
            </div>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerForm" class="hidden">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUsername" placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Choose a password">
            </div>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="regFirstName" placeholder="Enter first name">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="regLastName" placeholder="Enter last name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="regEmail" placeholder="Enter email">
            </div>
            <button class="btn" onclick="register()">Register</button>
            <button class="btn btn-secondary" onclick="showLogin()">Back to Login</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
